name: co-arising-canary-sync

on:
  repository_dispatch:
    types: [truthsrc-updated]
  workflow_dispatch:
    inputs:
      truthsrc_commit:
        description: 'Target metarch-truthsrc commit SHA or ref (blank = latest main)'
        required: false
        default: ''
      base_branch:
        description: 'Target PR base branch in bank-wealth-demo'
        required: false
        default: 'feat/co-arising-v2-pilot'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-canary:
    runs-on: ubuntu-latest
    steps:
      - name: Determine target branches & upstream ref
        id: meta
        run: |
          BASE_BRANCH="${{ inputs.base_branch || 'feat/co-arising-v2-pilot' }}"
          TRUTHSRC_REF="${{ github.event.client_payload.truthsrc_commit || inputs.truthsrc_commit || 'main' }}"
          echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "truthsrc_ref=$TRUTHSRC_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout bank-wealth-demo
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.base_branch }}
          path: bank-wealth-demo

      - name: Checkout metarch-truthsrc
        uses: actions/checkout@v4
        with:
          repository: co-arising/metarch-truthsrc
          ref: ${{ steps.meta.outputs.truthsrc_ref }}
          path: metarch-truthsrc

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Z3 & Coursier / Scala 2.12 (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y z3 scala
          curl -fL https://github.com/coursier/coursier/releases/latest/download/cs-x86_64-pc-linux.gz | gzip -d > /usr/local/bin/cs
          chmod +x /usr/local/bin/cs
          SCALA_CP=$(cs fetch -p org.scalatest:scalatest-funsuite_2.12:3.2.19)
          echo "COARISING_SCALA_CP=$SCALA_CP" >> "$GITHUB_ENV"

      - name: Update .truthsrc-pin.json to checked-out metarch-truthsrc SHA
        run: |
          TRUTHSRC_SHA=$(git -C metarch-truthsrc rev-parse HEAD)
          TRUTHSRC_VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('metarch-truthsrc/package.json','utf8')).version)")
          node -e '
            const fs = require("fs");
            const pinPath = "bank-wealth-demo/.truthsrc-pin.json";
            const pin = JSON.parse(fs.readFileSync(pinPath, "utf8"));
            pin.version = process.argv[1];
            pin.commit = process.argv[2];
            pin.pinnedAt = new Date().toISOString().slice(0, 10);
            fs.writeFileSync(pinPath, JSON.stringify(pin, null, 2) + "\n", "utf8");
          ' "$TRUTHSRC_VER" "$TRUTHSRC_SHA"

      - name: Regenerate, verify, audit coverage, run TCK & emit pilot-evidence.lock.json
        working-directory: bank-wealth-demo
        run: |
          npm run v2:compile
          node ../metarch-truthsrc/bin/truthsrc.js verify-v2 --root v2-pilot --target typescript,scala --canonical v2-pilot/.truthsrc/canonical-v2.json --db v2-pilot/.truthsrc/knowledge.sqlite --strict --mutation-gate
          npm run v2:audit-coverage
          npm run v2:tck
          npm run test:v2
          npm run v2:release-verify -- --strict-pin

      - name: Open or update canary sync PR if changes exist
        working-directory: bank-wealth-demo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Canary already in sync; no PR needed."
            exit 0
          fi
          TRUTHSRC_SHORT=$(git -C ../metarch-truthsrc rev-parse --short HEAD)
          git config user.name "co-arising-bot"
          git config user.email "co-arising-bot@users.noreply.github.com"
          git checkout -B automation/canary-sync
          git add -A
          git commit -m "chore(canary): sync pinned metarch-truthsrc @ ${TRUTHSRC_SHORT}"
          git push origin automation/canary-sync --force-with-lease
          BASE_BRANCH="${{ steps.meta.outputs.base_branch }}"
          EXISTING_PR=$(gh pr list --head automation/canary-sync --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head automation/canary-sync \
              --title "chore(canary): sync metarch-truthsrc @ ${TRUTHSRC_SHORT}" \
              --body "Automated canary sync triggered by \`metarch-truthsrc\` @ \`${TRUTHSRC_SHORT}\`. All v2 verification gates (\`verify-v2 --strict --mutation-gate\`, \`v2:audit-coverage\`, \`v2:tck\`, \`test:v2\`, and \`v2:release-verify --strict-pin\`) passed."
          else
            gh pr comment "$EXISTING_PR" --body "Updated canary sync branch for \`metarch-truthsrc\` @ \`${TRUTHSRC_SHORT}\`; all v2 gates passed."
          fi
