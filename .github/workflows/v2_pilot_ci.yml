name: co-arising-v2-pilot-ci

on:
  push:
    branches: [main, feat/co-arising-v2-pilot]
  pull_request:

jobs:
  v2-pilot-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout bank-wealth-demo
        uses: actions/checkout@v4
        with:
          path: bank-wealth-demo

      - name: Checkout metarch-truthsrc
        uses: actions/checkout@v4
        with:
          repository: co-arising/metarch-truthsrc
          path: metarch-truthsrc

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Z3 & Coursier / Scala 2.12 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y z3 scala
          curl -fL https://github.com/coursier/coursier/releases/latest/download/cs-x86_64-pc-linux.gz | gzip -d > /usr/local/bin/cs
          chmod +x /usr/local/bin/cs
          SCALA_CP=$(cs fetch -p org.scalatest:scalatest-funsuite_2.12:3.2.19)
          echo "COARISING_SCALA_CP=$SCALA_CP" >> "$GITHUB_ENV"

      - name: Install Z3 & Coursier / Scala 2.12 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install z3 scala@2.12 coursier/formulas/coursier
          echo "/opt/homebrew/opt/scala@2.12/bin" >> "$GITHUB_PATH"
          SCALA_CP=$(cs fetch -p org.scalatest:scalatest-funsuite_2.12:3.2.19)
          echo "COARISING_SCALA_CP=$SCALA_CP" >> "$GITHUB_ENV"

      - name: Verify frozen v1 bank-wealth-demo truth remains intact
        working-directory: bank-wealth-demo
        run: npm run validate

      - name: Run co-arising 2.0 pilot compile, strict verify (6 TS + 6 Scala + Mutation Gate), coverage (100%), S1 TCK, and mutation kill E2E
        working-directory: bank-wealth-demo
        run: |
          npm run v2:compile
          node ../metarch-truthsrc/bin/truthsrc.js verify-v2 --root v2-pilot --target typescript,scala --canonical v2-pilot/.truthsrc/canonical-v2.json --db v2-pilot/.truthsrc/knowledge.sqlite --strict --mutation-gate
          npm run v2:audit-coverage
          npm run v2:tck
          npm run test:v2
